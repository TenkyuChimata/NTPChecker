[package]
name = "NTPChecker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "time"] }
rkik-nts = { version = "0.3", optional = true }
chrono = { version = "0.4", features = ["clock"] }

[features]
default = []
nts = ["dep:rkik-nts"]